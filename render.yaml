 services:
    - type: web
      name: rag-agent-backend
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
      envVars:
        - key: GEMINI_API_KEY
          fromDatabase: true
        - key: COHERE_API_KEY
          fromDatabase: true
        - key: QDRANT_URL
          fromDatabase: true
        - key: QDRANT_API_KEY
          fromDatabase: true