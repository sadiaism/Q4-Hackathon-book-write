services:
  - type: web
    name: rag-agent-backend
    env: python
    region: oregon  # You can change this to your preferred region
    plan: free      # Use 'starter' for more resources if needed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # This will be set manually in the Render dashboard
      - key: COHERE_API_KEY
        sync: false  # This will be set manually in the Render dashboard
      - key: QDRANT_URL
        sync: false  # This will be set manually in the Render dashboard
      - key: QDRANT_API_KEY
        sync: false  # This will be set manually in the Render dashboard